name: Harana Automation - CI Quality Gate
description: Runs full Playwright regression suite on every Pull Request.

on:
  pull_request:
    branches: [ main, develop ]
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: Run Playwright Tests
      # We run all tests in headless mode. 
      # The '--reporter=html' ensures we get a report to upload.
      run: npx playwright test

    - name: Upload Test Results (Artifacts)
      # This step runs even if the previous step (the tests) failed.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          test-results/
          playwright-report/
        retention-days: 7

    - name: Upload Traces (For Debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces-${{ github.run_id }}
        path: test-results/
        retention-days: 7
